name: Matter node schema

on:
  push:
    branches: [main, research/matter-node-schema]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: matter-node-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matter-node-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install numpy
          npm install --global typescript@5
      - name: Run catalog and TypeScript validator tests
        run: python -m unittest tests.test_matter_nodes -v
