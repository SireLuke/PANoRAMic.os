name: Shared E8 root-system adapter audit

on:
  push:
    branches: [main, research/shared-e8-root-system-harness-2026-11-10]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shared-e8-roots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shared-e8-root-system:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical E8 roots and adapter equivalence
        run: python -m unittest tests.test_shared_e8_root_system -v
