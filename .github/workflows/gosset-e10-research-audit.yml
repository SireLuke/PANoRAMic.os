name: Gosset local cell-star and E10 exact audits

# Scoped 2026-11-20 (paths filters, same pattern as
# celestial-gosset-quasicrystal.yml): these exact audits run only when
# their own tests, audit scripts, shared geometry substrate, or this
# workflow change. Docs-only PRs skip them; workflow_dispatch above
# still runs them on demand at any time.
on:
  push:
    branches: [main, research/qwave-ci-audit-split-2026-11-10]
    paths:
      - "tests/test_gosset_local_cell_star_audit.py"
      - "tests/test_e10_coxeter_relations_audit.py"
      - "tests/test_e10_hyperbolic_621_coordinate_audit.py"
      - "tests/test_qwave.py"
      - "tests/test_gosset_projection_robustness_audit.py"
      - "experiments/gosset_local_cell_star_audit_v2.py"
      - "experiments/e10_coxeter_relations_audit.py"
      - "experiments/e10_hyperbolic_621_coordinate_audit.py"
      - "experiments/gosset_projection_robustness_audit.py"
      - "experiments/gosset_sierpinski_experiment.py"
      - "core/geometry/e8_root_system.py"
      - "core/abom_v8/qwave.py"
      - ".github/workflows/gosset-e10-research-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/test_gosset_local_cell_star_audit.py"
      - "tests/test_e10_coxeter_relations_audit.py"
      - "tests/test_e10_hyperbolic_621_coordinate_audit.py"
      - "tests/test_qwave.py"
      - "tests/test_gosset_projection_robustness_audit.py"
      - "experiments/gosset_local_cell_star_audit_v2.py"
      - "experiments/e10_coxeter_relations_audit.py"
      - "experiments/e10_hyperbolic_621_coordinate_audit.py"
      - "experiments/gosset_projection_robustness_audit.py"
      - "experiments/gosset_sierpinski_experiment.py"
      - "core/geometry/e8_root_system.py"
      - "core/abom_v8/qwave.py"
      - ".github/workflows/gosset-e10-research-audit.yml"
  workflow_dispatch:

# Do not cancel a running exact audit merely because another ref is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gosset-local-cell-star:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact Gosset local cell-star audit
        run: python -m unittest tests.test_gosset_local_cell_star_audit -v

  e10-coxeter-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact E10 Coxeter and affine-link audit
        run: python -m unittest tests.test_e10_coxeter_relations_audit -v

  e10-lorentzian-coordinates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact E10 Lorentzian coordinate and cusp-link audit
        run: python -m unittest tests.test_e10_hyperbolic_621_coordinate_audit -v

  qwave-si-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run QWAVE v0 SI and temporal metadata tests
        run: python -m unittest tests.test_qwave -v

  gosset-projection-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Gosset Coxeter-plane projection robustness tests
        run: python -m unittest tests.test_gosset_projection_robustness_audit -v
