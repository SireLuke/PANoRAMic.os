name: Gosset orthoplex graph-orbit audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [research/gosset-orthoplex-graph-orbit-v0, research/gosset-codim2-link-audit-v0]
  workflow_dispatch:

jobs:
  graph-orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent graph-to-Weyl reconciliation
        run: python -m unittest tests.test_gosset_orthoplex_graph_orbit -v
      - name: Run graph-to-cell incidence reconciliation
        run: python -m unittest tests.test_gosset_graph_incidence_reconciliation -v
      - name: Run codimension-two link-cycle audit
        run: python -m unittest tests.test_gosset_codim2_link_audit -v
      - name: Emit codimension-two link audit report
        run: PYTHONPATH=. python experiments/gosset_codim2_link_audit.py | tee gosset_codim2_link_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: gosset-codim2-link-audit
          path: gosset_codim2_link_audit.json
      - name: Emit exact incidence reconciliation report
        run: PYTHONPATH=. python experiments/gosset_graph_incidence_reconciliation.py | tee gosset_graph_incidence_reconciliation.json
      - uses: actions/upload-artifact@v4
        with:
          name: gosset-graph-incidence-reconciliation
          path: gosset_graph_incidence_reconciliation.json

  lean-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - name: Build Lean formalization
        working-directory: lean
        run: lake build
