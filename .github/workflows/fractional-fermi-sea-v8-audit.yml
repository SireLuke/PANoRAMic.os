name: Fractional Fermi sea V8 reference audit

on:
  push:
    branches: [main, research/fractional-fermi-sea-v8-bridge-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fractional-fermi-sea-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fractional-fermi-sea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run STRATA Fermi disk-partition tests
        run: python -m unittest tests.test_strata_003_fermi_disk_partition -v
      - name: Run fractional Fermi sea reference tests
        run: python -m unittest tests.test_fractional_fermi_sea -v
      - name: Run Zenodo dataset audit helper tests
        run: python -m unittest tests.test_ffs_zenodo_audit -v
      - name: Run STRATA-003 Fermi disk-partition and Zeng FFS evidence audit
        run: PYTHONPATH=. python experiments/strata/run_strata_003.py | tee strata-003-run.json
      - uses: actions/upload-artifact@v4
        with:
          name: strata-003-fermi-zeng-audit
          path: strata-003-run.json
      - name: Run existing ABOM V8 baseline tests
        run: python -m unittest discover -s tests -p 'test_abom_v8_model.py' -v
      - name: Run existing ABOM V8 adapter tests
        run: python -m unittest discover -s tests -p 'test_abom_v8_physics_adapters.py' -v
