name: QWAVE hydrogen baseline

on:
  push:
    branches: [main, research/qwave-hydrogen-baseline]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qwave-hydrogen-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hydrogen-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run QWAVE and hydrogen baseline tests (standard library only)
        run: python -m unittest tests.test_qwave tests.test_hydrogen_baseline -v
