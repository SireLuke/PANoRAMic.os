reproduction:
  instructions: "Review the preregistered specification and first-pass result packet in experiments/flip_qubit/. The source packet describes a retained script and raw output in hidden_files/flip-qubit/ in its review workspace; confirm whether those artifacts are available in the public repository before attempting an exact rerun. For the follow-up audit, use the PR #118 test command and documented 1000-sample procedure after verifying the merged file paths and dependencies."
  expected_outputs: "Reproduce the E8/Gosset graph contract, flip-group commutativity, stabilizer commutation/rank, antipodal-cut GF(2) rank 112, and double-flip/stabilizer non-commutation count 26880/57600. Follow-up sampling should report full distributions and sampling details, not only a single contrast."
  known_blockers:
