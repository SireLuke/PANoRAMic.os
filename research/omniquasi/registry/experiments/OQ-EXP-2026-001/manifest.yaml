    - "A gate set, universality, quantum advantage, error correction, noise tolerance, or quantum-computing hardware."
    - "Physical dynamics, Hamiltonian, energy scale, or new physics."
    - "That 112 is the maximum or extremal balanced-cut rank."
    - "That the Fermi yin-yang drawing is a physical mechanism."
  limitations:
    - "No gate set, universality, noise model, error correction, dynamics, or hardware was tested."
    - "V8 remains cartography, not a dynamics engine; Janus remains a translator."
    - "QWAVE is limited here to SI photon relations and measurement metadata, not a quantum solver."
    - "First-pass comparison includes only one seeded random balanced cut."
  alternative_explanations:
    - "The high antipodal-cut rank may be a property of this particular graph partition; broader seeded controls are needed to characterize it."
  falsifiers:
    - "Failure to independently reproduce the E8/Gosset graph contract or any preregistered exact result."
    - "A correct independent implementation yielding different stabilizer, cut-rank, or commutation results under the stated definitions."
