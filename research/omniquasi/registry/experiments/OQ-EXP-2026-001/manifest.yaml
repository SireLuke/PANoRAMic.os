results:
  summary: "First-pass narrow computational checks reported as passing/reproducible pattern. Broader computing interpretation remains analogy."
  observations:
    - "E1 geometry gate: 240 roots, degree 56, 6720 edges, BFS shells 1/56/182/1, diameter 3, 120 antipodal pairs, and no root adjacent to its antipode."
    - "E2: 120 antipodal flips are involutions and pairwise commuting; generated group is (Z/2)^120, hence classical by themselves."
    - "E3: all 240 weight-57 graph-state stabilizers commute pairwise; tableau rank is 240 over GF(2)."
    - "E4: antipodal cut rank is 112 ebits out of maximum 120, with 2240 crossing edges; one seeded random balanced cut reported rank 95."
    - "E5: antipodal double-flips fail to commute with 26880 of 57600 stabilizer pairings (46.7%); source packet attributes the non-commutation entirely to adjacency."
    - "Representation: Fermi yin-yang lobes represent alpha and -alpha; occupancy is proposed as a state dial; stretched lobes represent antipodal separation. The narrowing gap is explicitly an open design question."
  uncertainty: "The first-pass exact arithmetic is reported, but an independent rerun remains outstanding. A single random cut of rank 95 is only a contrast; it does not establish the distribution or extremality of rank 112."
  failures_and_negative_results:
    - "Flips alone are abelian and do not constitute a non-commuting quantum operation; this is a preregistered scope boundary, not a failed test."
interpretation:
  supported_claims:
    - "The reported finite E8/Gosset graph contract and exact finite graph-state computations, subject to independent reproduction."
    - "Antipodal flips alone form a commuting classical register."
    - "The adjacency-defined graph state has the reported stabilizer and cut-rank properties."
  unsupported_claims:
