schema_version: "0.1"
experiment_id: "OQ-EXP-2026-001"
title: "Flip Eqbits on the Gosset Graph"
created: "2026-11-21"
updated: "2026-11-21"
status: "completed"
maturity: "exploratory"
domain:
  primary: "E8/Gosset graph geometry"
  secondary: ["graph states and stabilizer algebra", "quantum information representation", "V8/Fermi yin-yang cartography"]
claim_class: "exact_computation"
summary: "A preregistered exact-arithmetic investigation of whether antipodal pairs in the E8 Gosset graph provide natural two-level flip systems, and how graph-state adjacency contributes stabilizer phase and entanglement. The narrow graph and GF(2) computations are reported as reproducible patterns; the broader 'flip eqbit' computing interpretation remains an analogy."
question: "Can an antipodal pair {alpha, -alpha} of the E8 Gosset graph be treated as a two-level flip system, and what additional structure does graph adjacency contribute?"
hypothesis: "Antipodal flips form a commuting two-level register; the Gosset adjacency graph supplies non-commuting stabilizer phase and a measurable graph-state entanglement structure."
null_hypothesis: "The antipodal flips alone provide no non-commuting operation; any observed non-commutation must arise from the graph-state adjacency/stabilizer structure."
success_criteria:
  - "Reproduce the 240-root Gosset graph contract: degree 56, 6720 edges, BFS shells 1/56/182/1, diameter 3, and 120 antipodal pairs."
  - "Verify all 120 antipodal flips are involutions and commute pairwise."
  - "Verify 240 graph-state stabilizers commute pairwise and have tableau rank 240 over GF(2)."
  - "Compute the antipodal-cut adjacency rank over GF(2) exactly."
  - "Compute symplectic commutation counts for antipodal double-flips against graph-state stabilizers."
controls:
  - name: "One seeded random balanced 120|120 cut (first pass)"
    rationale: "Provides a single contrast for the antipodal-cut rank; it is not a distribution or proof of extremality."
    method: "Compute GF(2) rank of the corresponding cross-cut adjacency matrix; first-pass reported rank 95."
  - name: "Random antipodal transversals and arbitrary balanced 120|120 cuts (follow-up audit)"
    rationale: "Broader cut-rank controls reduce dependence on one comparison cut."
    method: "PR #118 adds deterministic seeded sampling and audit tests; its PR description says the tests and 1000-sample audit still require CI execution."
