reproduction:
  instructions: "Re-run `tg_press2.py analyze` on the filed press2_re1600_n128.json to reproduce every verdict number exactly (verified twice on the run host, identical output). Re-running the solver with the filed command reproduces the run up to floating-point and host variation; checkpoints make the run resumable."
  expected_outputs: "Stage A: eps_max 0.0138 at t = 8.925, gate PASS. O1: 1/17 hits, real mean 0.3189 vs shuffle mean 0.3414, separates = false. O3: 0/17 hits, real mean 0.00695 vs shuffle 0.01041, separates = false. O2: 17/17, real mean 14.88 vs shuffle 3.00 (witness only). Verdict: O1 fails - negative result."
  known_blockers:
    - "The verdict rests on a single realization of the flow (one Taylor-Green run); the null at each snapshot is an ensemble of 100 shuffles, but run-to-run variability of the real observable is not sampled."
results:
  summary: "Stage A PASS; O1 FAILS (1/17, real mean below the shuffle mean); O3 FAILS (0/17); O2 witness separates 17/17. The phase-aware repair fails at N=128 - negative result."
  observations:
    - "Stage A: eps_max = 0.0138 at t = 8.925 vs pinned 0.01286 at 8.97 (ratio 1.070, inside gate) - the solver remains honest at this resolution."
    - "O1: hit count 1/17 (only the first in-window snapshot); real mean 0.3189 vs shuffle mean 0.3414; null false-positive rate 0.0."
    - "O3: hit count 0/17; real mean 0.00695 vs shuffle mean 0.01041; null false-positive rate 0.0."
    - "O2: hit count 17/17; real mean 14.88 vs shuffle mean 3.00 (Gaussian) - the field is strongly non-Gaussian, so the O1/O3 negatives are live measurements, not a dead run."
  uncertainty: "One flow realization; N=128 resolution. The shuffle null is an ensemble (M=100) at each snapshot, so the per-snapshot comparison is distributional on the null side only."
  failures_and_negative_results:
    - "The preregistered separation rule fired as a falsifier: neither phase-aware observable separates from the in-run shuffle null at N=128, so the phase-aware dictionary repair is filed as a negative result."
interpretation:
  supported_claims:
    - "The press solver remains calibrated at N=128 against the pinned published Taylor-Green reference (Stage A)."
    - "At N=128, Re=1600, triadic phase coherence and antipodal biphase - as defined in the preregistration - do not distinguish the real Taylor-Green field from phase-shuffled copies of itself."
  unsupported_claims:
    - "Any claim about Navier-Stokes regularity or finite-time blow-up; Navier-Stokes remains not_tested."
    - "Any Fermi-sea mechanism claim resting on these observables at this resolution."
    - "That phase coherence is absent from the flow in general - only that these statistics, at this resolution, on this realization, do not detect any beyond the shuffle null."
  limitations:
    - "Single flow realization; no ensemble of real runs."
    - "Resolution deliberately held at N=128 for comparability with Press I, per the preregistration; the declared ladder makes a different observable, not higher resolution, the next move if any."
    - "O2 is a witness by design and grades nothing."
  alternative_explanations:
    - "The observables may be too coarse (triad cap, kmax 32, single-scale biphase set) to register the coherence that O2's kurtosis implies is present in amplitude statistics."
    - "Coherence may live in amplitude-phase coupling that pure phase statistics discard."
  falsifiers:
    - "The preregistered falsifier - failure to separate from the in-run shuffle null - is the outcome recorded here."
