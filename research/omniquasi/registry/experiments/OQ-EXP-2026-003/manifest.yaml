  preprocessing: "Conventions C6-C8 (inactive snapshots count as not separating; O3 one q per antipodal pair with 4 <= |k| <= 32 and |q-k| <= 32; O2 ensembles at the 0.25 snapshots) were ratified by the maintainer before the run and are recorded in the results note."
method:
  description: "Fourier pseudospectral solver (tg_press2.py) for unforced incompressible Navier-Stokes on [0,2pi)^3 with Taylor-Green initial conditions, identical parameters to Press I. At every 0.25-cadence snapshot the live field is phase-shuffled M=100 times and O1 (triadic phase coherence over triads |k|,|p|,|q| <= 32, cap 200,000, active-weight gate), O3 (antipodal biphase, one q per +- pair per convention C7), and O2 (vorticity kurtosis, Gaussian value 3) are recomputed on the real field and each shuffle. Separation per observable: real value beats the ensemble 95th percentile at >= 9 of the 17 in-window snapshots (t in [6,10]); inactive O1/O3 snapshots count as not separating (C6)."
  equations_or_specification:
    - "Separation: #{snapshots in [6,10] : real > P95(shuffles)} >= 9 of 17."
    - "O1: weighted mean resultant length of triad phase sums over the preregistered triad set (173,328 triads realized under the cap)."
    - "O3: antipodal biphase coherence over the C7 q set (9 q vectors)."
  parameters:
    N: 128
    nu_main: 0.000625
    Re: 1600
    T: 12.0
    dt: 0.005
    steps: 2400
    M_shuffles: 100
    triad_cap: 200000
    kmax: 32
    seed0: 20261122
  random_seeds: ["Shuffle ensembles: 20261122 + i, i = 0..99, per snapshot."]
  environment: "Python/NumPy pseudospectral solver (tg_press2.py); checkpointed, resumable run; the production run survived three host VM reboots via checkpoints (died at steps 1000, 1000, 1800; landed 2400/2400)."
  commands:
    - "python3 -m experiments.navier_stokes.press2.tg_press2 run --out <runs> --tag press2_re1600_n128 --N 128 --Re 1600 --T 12 --dt 0.005 --M 100 --cap 200000 --kmax 32"
    - "python3 -m experiments.navier_stokes.press2.tg_press2 analyze --out <runs> --tag press2_re1600_n128"
  resource_limits: {}
