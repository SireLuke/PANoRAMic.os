schema_version: "0.1"
experiment_id: "OQ-EXP-2026-003"
title: "NS Press II: Phase-Aware Observables vs In-Run Shuffle Nulls"
created: "2026-11-23"
updated: "2026-11-23"
status: "completed"
maturity: "refuted"
domain:
  primary: "Navier-Stokes & CFD"
  secondary: ["Fermi-sea programme", "STRATA claim grading", "Cross-Domain Methods & Validation"]
claim_class: "numerical_experiment"
summary: "A preregistered successor press to OQ-EXP-2026-002. Press I's Stage C statistic (the spectral occupation front) was phase-blind by construction and failed to separate from a phase-shuffled control. Press II tested the phase-aware repair at identical parameters (Taylor-Green, Re 1600, N=128): triadic phase coherence (O1, flagship), antipodal biphase (O3), and vorticity kurtosis (O2, witness only), each against an in-run null of M=100 phase shuffles of the same field at the same instant. Stage A solver honesty PASSED. O1 separated at only 1 of 17 in-window snapshots (9 required) with its real mean below the shuffle mean; O3 separated at 0 of 17. O2 separated 17/17, confirming the field is genuinely turbulent. The phase-aware repair FAILS at N=128 and is registered as a negative result under the preregistration's own separation rule. Navier-Stokes remains not_tested."
question: "Do phase-aware observables of a Taylor-Green flow - triadic phase coherence and antipodal biphase - carry signal about coherent dynamics that separates from phase-shuffled copies of the same field with the identical spectrum?"
hypothesis: "At least the flagship observable O1 (triadic phase coherence) beats the 95th percentile of its in-run shuffle ensemble at 9 or more of the 17 in-window snapshots (t in [6,10])."
null_hypothesis: "The phase-aware observables are, at this resolution, properties of the spectrum and the statistic rather than of coherent phase dynamics: phase-shuffled copies of the same field reproduce them."
success_criteria:
  - "Stage A gate (inherited): eps_max within +10%/-5% of the pinned reference 0.01286 and t_peak within +-0.4 of 8.97."
  - "O1 separation: real C_tri exceeds the M=100 shuffle ensemble 95th percentile at >= 9 of 17 in-window snapshots."
  - "O3 separation: same rule applied to the antipodal biphase."
  - "O2 is a witness only and cannot satisfy or fail the press."
controls:
  - name: "In-run phase-shuffle ensemble (M = 100 per snapshot)"
    rationale: "The sharp null: the same field, same spectrum, phases destroyed, at the same instant. If an observable detects coherence present in this field now, it must beat this ensemble."
    method: "Hermitian-symmetric shuffles preserving |u_hat(k)| exactly, seeds 20261122 + i (i = 0..99), recomputed at every statistics snapshot (0.25 cadence); conventions C1-C8 as preregistered."
  - name: "Calibration self-test (pre-run)"
    rationale: "The machinery must separate a planted coherent control and must not separate an incoherent field, before any production number is trusted."
    method: "press2_selftest.py on the run host: planted control separated 17/17, incoherent field 1/17, null false-positive rate 0.0 over the ensemble; 11/11 unit tests pass."
