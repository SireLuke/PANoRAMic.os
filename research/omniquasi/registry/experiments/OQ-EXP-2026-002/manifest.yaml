reproduction:
  instructions: "Re-run the analysis scripts on the filed run JSONs in experiments/navier_stokes/press_data/ to reproduce every Stage C number exactly. Re-running the solver with the filed commands reproduces the runs up to floating-point and host variation; checkpoints make the runs resumable."
  expected_outputs: "Stage A: eps_max 0.0137585 at t = 8.90 (PASS). Stage B: BKM integral 188.36 (in band). Stage C main: ceiling ratio 0.428; log-phi amp/resid_std 0.828. Shuffle control: ceiling ratio 0.461; log-phi amp/resid_std 0.938. Verdict: Stage C negative (no separation)."
  known_blockers:
    - "The control comparison rests on a single shuffle realization (a point comparison, not an ensemble 95th percentile); this caveat is declared in stage_c_controls.py and in PRESS_RESULTS.md."
    - "The nu=0.01 baseline JSON is appended on landing; the separation verdict does not depend on it."
results:
  summary: "Stage A PASS; Stage B in band; Stage C NEGATIVE - the occupation-front signature does not separate from the phase-shuffled identical-spectrum control on either leg."
  observations:
    - "Stage A: eps_max = 0.0137585 at t = 8.90 vs pinned 0.01286 at 8.97 (ratio 1.070, inside gate); enstrophy peak 11.007 vs derived ~10.3, same coarse-grid overshoot direction as the published ladder."
    - "Stage B: BKM integral over [0,10] = 188.36 (declared band 180-210; ladder 161 at 96^3, 223 at 192^3, 250 at 256^3); ||omega||_inf peak 44.24 at t = 8.70."
    - "Stage C ceiling: main run ratio 0.428 (PASS); shuffle control ratio 0.461 (also PASS), front peak 56 vs main 58, same saturating shape."
    - "Stage C periodicity: main log-phi amp/resid_std 0.828, global best period 0.584; shuffle log-phi 0.938, global best 0.959 at period 0.580. The control meets or exceeds the main run at the log-phi, S-bar, and 2 log-phi candidates."
  uncertainty: "Single shuffle realization; N=128 resolution with Kolmogorov estimate k_d ~ 87 exceeding the front (~57), so grid truncation is a live alternative explanation that the shuffle result strengthens."
  failures_and_negative_results:
    - "Stage C falsifier fired as preregistered: the signature fails to separate from the phase-shuffled control by the declared margins, so the tested Fermi-sea dictionary entry is filed as a negative result."
interpretation:
  supported_claims:
    - "The press solver is calibrated at N=128 against pinned published Taylor-Green references (Stage A) and its BKM integral sits in the declared resolution-ladder band (Stage B)."
    - "At N=128, the occupation front K(t) and its approach are spectrum/statistic-dominated: a phase-scrambled field with the identical spectrum reproduces the ceiling shape and the log-phi scan statistics."
  unsupported_claims:
    - "Any claim about Navier-Stokes regularity or finite-time blow-up; Navier-Stokes remains not_tested."
    - "Any Fermi-sea mechanism claim resting on the occupation-front statistic at this resolution."
    - "That a ceiling or log-periodicity in K(t) evidences coherent dynamics."
  limitations:
    - "One shuffle realization; no ensemble percentile."
    - "Front definition threshold (1e-3 of total energy) is the preregistered one; other thresholds were not scanned."
    - "BKM integral uses trapezoid sampling every 0.025, biased low on spikes, as declared in Amendment 1."
  alternative_explanations:
    - "Grid truncation: the front saturates near the resolved range in both runs (k_d ~ 87 > front ~ 57 is not satisfied - the front sits below k_d but the saturation may still track the spectrum's extent, which both runs share by construction)."
    - "The front statistic is phase-blind by construction (it reads shell energies only), so phase coherence cannot appear in it; a phase-aware statistic is a different instrument."
  falsifiers:
    - "The preregistered falsifier - failure to separate from the controls - is the outcome recorded here."
