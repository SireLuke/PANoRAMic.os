  datasets:
    - "Stage A reference: 512^3 spectral Taylor-Green dataset (spectral_Re1600_512.gdiag, attributed to van Rees et al. 2011), peak dissipation 0.0128575 at t = 8.97 as read by the Autan validation catalogue; corroborated by Brachet et al. 1983 (~0.0126) and the NSLab resolution ladder."
  licenses_and_access: ["Repository artifacts; observe repository license and access terms."]
  preprocessing: "Amendment 1 pins (Stage A references, Stage B expectations, Stage C definitions and candidate families) were recorded in the preregistration's workspace copy before any press analysis."
method:
  description: "Fourier pseudospectral solver (rfftn, 2/3 dealiasing, Leray projection, classical RK4) for unforced incompressible Navier-Stokes on [0,2pi)^3 with Taylor-Green initial conditions. Diagnostics every 0.025 time units; shell spectra every 0.25. Occupation front K(t) = smallest shell k with energy in shells > k below 1e-3 of total energy. Ceiling test fits log K on t in [4, t(eps_max)] with a saturating model log K = a - b*exp(-(t-4)/tau) (tau gridded) against a no-ceiling model log K = a + c*log(t-3). Log-periodicity scan fits sinusoids in log t to the winning model's residuals over periods 0.10-1.50 and reports amp/resid_std at the pinned candidates."
  equations_or_specification:
    - "Front: K(t) = min{ k : sum_{j>k} E_j < 1e-3 * sum_j E_j }."
    - "Ceiling (i): log K = a - b*exp(-(t-4)/tau). No-ceiling (ii): log K = a + c*log(t-3). Pass: RMS(i)/RMS(ii) < 0.8."
    - "Candidates (i) log-phi family: 0.2406, 0.4812, 0.9624. (ii) bridge-note constants: S-bar 0.36, twist 2pi/19 = 0.3307."
  parameters:
    N: 128
    nu_main: 0.000625
    Re: 1600
    T: 12.0
    dt: 0.005
    steps: 2400
    shuffle_seed: 20261121
    nu_baseline: 0.01
  random_seeds: ["Phase-shuffled control: 20261121."]
  environment: "Python/NumPy pseudospectral solver (tg_press.py); checkpointed, resumable runs; the main run and both controls survived multiple host reboots via checkpoints."
  commands:
    - "python3 tg_press.py 128 re1600_n128 0.000625"
    - "python3 tg_press.py 128 re1600_n128_shuffle 0.000625 20261121"
    - "python3 tg_press.py 128 re001_nu001 0.01"
    - "python3 stage_c_analysis.py; python3 stage_c_controls.py <run.json> <out.json>"
  resource_limits: {}
