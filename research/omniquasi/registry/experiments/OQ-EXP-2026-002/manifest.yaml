schema_version: "0.1"
experiment_id: "OQ-EXP-2026-002"
title: "NS Press Stages A-C: Taylor-Green Calibration, BKM Monitoring, and the Fermi-Sea Front Test"
created: "2026-11-21"
updated: "2026-11-21"
status: "completed"
maturity: "refuted"
domain:
  primary: "Navier-Stokes & CFD"
  secondary: ["Fermi-sea programme", "STRATA claim grading", "Cross-Domain Methods & Validation"]
claim_class: "numerical_experiment"
summary: "A preregistered three-stage press on a Taylor-Green vortex at Re 1600, N=128. Stage A calibrated the solver against pinned published references (PASS). Stage B monitored the Beale-Kato-Majda integral under the declared band (in band). Stage C tested the Fermi-sea dictionary entry - the spectral occupation front K(t) - for a saturating ceiling approach and log-periodicity at pinned candidate periods, against a phase-shuffled identical-spectrum control and a decaying nu=0.01 baseline. The Stage C signature FAILED to separate from the phase-shuffled control on both legs and is registered as a negative result under the preregistration's own falsifier. Navier-Stokes remains not_tested."
question: "Does the spectral occupation front K(t) of a Taylor-Green flow carry a dynamics-specific signature - a saturating ceiling approach with log-periodicity at the pinned candidate periods - that separates from a phase-shuffled field with the identical energy spectrum?"
hypothesis: "The front K(t) rises toward a ceiling (saturating model beats the no-ceiling model by residual-RMS ratio < 0.8 on the intensification interval) and its approach is log-periodic at the pinned candidates (log-phi family; bridge-note constants S-bar ~ 0.36 and twist 2pi/19), with scan statistics exceeding the controls'."
null_hypothesis: "The front signature is a property of the energy spectrum and the front statistic at this resolution, not of the coherent dynamics: a phase-shuffled field with the identical spectrum reproduces it."
success_criteria:
  - "Stage A gate: eps_max within +10%/-5% of the pinned reference 0.01286 and t_peak within +-0.4 of 8.97."
  - "Stage B: BKM integral over [0,10] inside the declared 180-210 band from the published resolution ladder."
  - "Stage C ceiling: saturating model residual-RMS ratio < 0.8 against the no-ceiling model on t in [4, t(eps_max)]."
  - "Stage C periodicity: per-candidate scan statistic (amp/resid_std) at the pinned candidates exceeds the controls' corresponding statistics."
controls:
  - name: "Phase-shuffled control (identical spectrum)"
    rationale: "Preserves |u_hat(k)| per mode and divergence-freeness while destroying phase coherence; if the signature survives shuffling, it is spectrum-driven, not dynamics-driven."
    method: "Same solver and pipeline, Hermitian-symmetric random phases, seed 20261121, tag re1600_n128_shuffle; analysed with identical Stage C machinery (stage_c_controls.py)."
  - name: "Decaying baseline (nu = 0.01)"
    rationale: "A strongly viscous run with no intensification phase; the machinery must not manufacture a ceiling or a front where none exists."
    method: "Same solver, nu = 0.01, tag re001_nu001; ceiling test applies only if a preregistered intensification interval exists (t(eps_max) >= 4)."
